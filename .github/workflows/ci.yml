name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test OboeCore
        run: swift test --package-path Packages/OboeCore

      - name: Validate bundled JLPT library
        run: |
          python3 Scripts/build_jlpt_library.py \
            --validate-existing \
            --output OboeApp/Resources/JLPT/jlpt-library.sqlite \
            --notice OboeApp/Resources/JLPT/NOTICE.txt

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Oboe.xcodeproj \
            -scheme Oboe \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run navigation smoke test
        run: |
          DEVICE_ID="$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid')"
          echo "Using simulator: $(xcrun simctl list devices | grep "$DEVICE_ID" || true)"
          set -o pipefail
          xcodebuild \
            -project Oboe.xcodeproj \
            -scheme Oboe \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:OboeUITests/OboeNavigationUITests/testPrimaryNavigationSmoke \
            test 2>&1 | tee smoke.log
          grep -q "testPrimaryNavigationSmoke.*passed" smoke.log || {
            echo "::error::navigation smoke test case was not executed or did not pass"
            exit 1
          }

  app-unit-tests:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run OboeAppTests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid')"
          echo "Using simulator: $(xcrun simctl list devices | grep "$DEVICE_ID" || true)"
          set -o pipefail
          xcodebuild \
            -project Oboe.xcodeproj \
            -scheme Oboe \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:OboeAppTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee app-tests.log
          grep -q "OboeAppTests.xctest.*passed" app-tests.log || {
            echo "::error::OboeAppTests bundle was not executed or did not pass"
            exit 1
          }

  ipad-smoke:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build and run iPad navigation smoke
        run: |
          DEVICE_ID="$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPad")))] | first | .udid')"
          echo "Using simulator: $(xcrun simctl list devices | grep "$DEVICE_ID" || true)"
          set -o pipefail
          xcodebuild \
            -project Oboe.xcodeproj \
            -scheme Oboe \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:OboeUITests/OboeNavigationUITests/testPrimaryNavigationSmoke \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee ipad-smoke.log
          grep -q "testPrimaryNavigationSmoke.*passed" ipad-smoke.log || {
            echo "::error::iPad navigation smoke test case was not executed or did not pass"
            exit 1
          }
